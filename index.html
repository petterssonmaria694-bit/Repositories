<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // 主题预加载：尽早恢复上次选择，避免刷新时浅色/深色闪烁（与 src/hooks/useTheme.js 同一 key）
    try {
      if (localStorage.getItem("profile-theme") === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (e) {}
  </script>
  <title>王宇恒 · 欢迎</title>

    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;600;700&family=Baloo+2:wght@600;700;800&family=ZCOOL+KuaiLe&display=swap"
    rel="stylesheet"
  />
</head>

</body>
</html>
